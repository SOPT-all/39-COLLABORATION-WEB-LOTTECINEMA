name: Auto Assign Reviewers

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest

    steps:
      - name: Assign author and request reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // 1. 팀원 목록
            const members = ['chaewon41', 'zzos0014', 'a1rhun', 'nueisx'];

            // 2. 이슈/PR 작성자 확인(팀원이 아니면 건너뜀)
            const target = context.payload.issue ?? context.payload.pull_request;
            const author = target.user.login;

            if (!members.includes(author)) return;

            // 3. 작성자를 Assignee로 지정
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: target.number,
              assignees: [author],
            });

            // 4. 작성자를 제외한 팀원을 Reviewer로 지정
            const pr = context.payload.pull_request;
            if (!pr || pr.draft) return;

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: pr.number,
              reviewers: members.filter((member) => member !== author),
            });
